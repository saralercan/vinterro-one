name: Vinterro One Pinned Upstream Regression

on:
  pull_request:
    paths:
      - '.github/workflows/upstream-runtime-regression.yml'
      - 'scripts/check_repository_safety.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-runtime-regression.yml'
      - 'scripts/check_repository_safety.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    name: Upstream Python agent and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited upstream control-plane commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: saralercan/ercan
          ref: c544cd600e25f7797072a5d97313c45b0c590d5b
          path: upstream
          persist-credentials: false
      - name: Verify source commit pin
        working-directory: upstream
        run: |
          test "$(git rev-parse HEAD)" = "c544cd600e25f7797072a5d97313c45b0c590d5b"
      - name: Verify all-agent and nine-skill routing
        working-directory: upstream
        run: python3 -m unittest discover -s tests -p 'test_reklam_ajansi_global_dispatch.py' -v
      - name: Run complete agent regression corpus
        working-directory: upstream
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  runtime-regression:
    name: Upstream worker, supervision and runtime QA
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited upstream control-plane commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: saralercan/ercan
          ref: c544cd600e25f7797072a5d97313c45b0c590d5b
          path: upstream
          persist-credentials: false
      - name: Verify source commit pin
        working-directory: upstream
        run: |
          test "$(git rev-parse HEAD)" = "c544cd600e25f7797072a5d97313c45b0c590d5b"
      - name: Run read-only worker, supervisor, Codex and ChatGPT tests
        working-directory: upstream
        run: npm run test:all
