name: Repository Safety Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-public-source-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run repository safety policy tests
        run: python3 -m unittest discover -s tests -p 'test_repository_safety.py' -v
      - name: Enforce public/private source policy
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: python3 scripts/check_repository_safety.py
